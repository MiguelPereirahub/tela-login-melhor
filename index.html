        <body>
            <main>
                <article id="login">
                    <div id="imagem">
                <!--onde esta a imagem-->
                    </div>
                    <div id="form">
                        <h1>login</h1>
                        <p>seja bem vindo(a)! novamente. Faça login para acessar sua conta e fazer configurações no seu ambiente.</p>
                        <form action="login.php" method="post" autocomplete="on">
                            <div id="input">
                                <label for="email">
                                    <input class="campos" type="email" name="" id="email"
                                    autocomplete="email"
                                    placeholder="Seu Email"
                                    required
                                    >
                                </label>
                            </div>
                            <div id="input">
                                <label for="senha">
                                    <input class="campos" type="password" name="" id="senha"
                                    required minlength="8" maxlength="25"
                                    autocomplete="current-password"
                                    placeholder="Sua Senha"
                                    >
                                </label>
                            </div>
                            <input type="submit" value="Entrar" class="entrar">
                            <a href="" class="esqueci">Esqueci a Senha</a>
                        </form>
                    </div>
                </article>
            </main>
